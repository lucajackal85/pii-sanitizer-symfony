name: php-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v3
        env:
          # lucajackal85/pii-sanitizer-php is a private repository, which the default GITHUB_TOKEN can't read.
          # Add a repository secret COMPOSER_GITHUB_TOKEN: a fine-grained token with read access to its contents.
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.COMPOSER_GITHUB_TOKEN }}"}}'
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --no-progress

  # The two jobs below run on the minimum supported PHP version, so the tools don't suggest newer syntax.
  # Each fails when its tool would change something: fix locally with `composer cs-fix` / `composer rector-fix`.
  php-cs-fixer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
      - uses: ramsey/composer-install@v3
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.COMPOSER_GITHUB_TOKEN }}"}}'
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

  rector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
      - uses: ramsey/composer-install@v3
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.COMPOSER_GITHUB_TOKEN }}"}}'
      - run: vendor/bin/rector process --dry-run
