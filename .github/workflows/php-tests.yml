name: php-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Symfony ${{ matrix.symfony }} · PHP ${{ matrix.php }} · MonologBundle ${{ matrix.monolog-bundle }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Symfony 6.4 LTS: MonologBundle 4 needs Symfony >= 7.3, so only 3.x here.
          - { symfony: "6.4", monolog-bundle: "3", php: "8.1" }
          - { symfony: "6.4", monolog-bundle: "3", php: "8.4" }
          # Symfony 7.4 LTS: both MonologBundle majors are supported.
          - { symfony: "7.4", monolog-bundle: "3", php: "8.2" }
          - { symfony: "7.4", monolog-bundle: "4", php: "8.2" }
          - { symfony: "7.4", monolog-bundle: "4", php: "8.3" }
          # Symfony 8 needs PHP >= 8.4.
          - { symfony: "8.0", monolog-bundle: "4", php: "8.4" }
          - { symfony: "8.1", monolog-bundle: "4", php: "8.4" }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Pin Symfony ${{ matrix.symfony }} and MonologBundle ${{ matrix.monolog-bundle }}
        run: >-
          composer require --no-update --no-interaction
          "symfony/config:${{ matrix.symfony }}.*"
          "symfony/dependency-injection:${{ matrix.symfony }}.*"
          "symfony/http-kernel:${{ matrix.symfony }}.*"
          "symfony/monolog-bundle:${{ matrix.monolog-bundle == '3' && '^3.10' || '^4.0' }}"
      - uses: ramsey/composer-install@v3
      - name: Installed versions
        run: composer show | grep -E '^(symfony/(http-kernel|monolog-bundle)|monolog/monolog|lucajackal85/pii-sanitizer-php) '
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --no-progress

  lowest:
    # The oldest versions composer.json allows: Symfony 6.4.0, MonologBundle 3.10, pii-sanitizer-php 0.1.0, ...
    name: Lowest dependencies · PHP 8.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: lowest
      - name: Installed versions
        run: composer show | grep -E '^(symfony/(http-kernel|monolog-bundle)|monolog/monolog|lucajackal85/pii-sanitizer-php) '
      - run: vendor/bin/phpunit

  # The two jobs below run on the minimum supported PHP version, so the tools don't suggest newer syntax.
  # Each fails when its tool would change something: fix locally with `composer cs-fix` / `composer rector-fix`.
  php-cs-fixer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

  rector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/rector process --dry-run
